<div class="chip-grid">
  {% for kind, label in missing_kinds %}
    <a href="{% url 'receipt_create' property.pk %}?kind={{ kind }}" data-modal class="chip">
      <svg class="icon"><use href="#i-r-{{ kind }}"/></svg>{{ label }}
    </a>
  {% endfor %}
  <a href="{% url 'receipt_create' property.pk %}?kind=custom" data-modal class="chip chip-dashed">
    <svg class="icon"><use href="#i-plus"/></svg>Своя услуга
  </a>
</div>
