{% extends "base.html" %}
{% block title %}RentFlow{% endblock %}
{% block content %}
<div class="app-shell">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">R</span>
      <span class="brand-name">RentFlow</span>
    </div>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-link">Выйти</button>
    </form>
  </header>
  <main class="app-main">
    <h1>Добро пожаловать, {{ full_name }}!</h1>
    <p class="subtitle">Здесь скоро появятся ваши объекты недвижимости.</p>
  </main>
</div>
{% endblock %}
