{% extends "base.html" %}
{% block title %}Выход — RentFlow{% endblock %}
{% block content %}
<div class="page-center">
  <div class="card">
    <h1>Выйти из аккаунта?</h1>
    <p class="subtitle">Чтобы вернуться, понадобятся почта и пароль.</p>
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {{ redirect_field }}
      <button type="submit" class="btn btn-primary">Выйти</button>
    </form>
    <p class="footer-note"><a href="{% url 'home' %}">Вернуться в кабинет</a></p>
  </div>
</div>
{% endblock %}
