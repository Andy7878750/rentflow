<div class="field">
  <div class="field-row">
    <label for="{{ field.id_for_label }}">{{ label }}</label>
    {% if forgot_link %}<a class="field-row-link" href="{% url 'account_reset_password' %}">Забыли пароль?</a>{% endif %}
  </div>
  <div class="password-field">
    <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required{% if autofocus %} autofocus{% endif %}{% if strength %} data-password-strength{% endif %}>
    <button type="button" class="password-toggle" data-toggle-password="{{ field.id_for_label }}" aria-label="Показать пароль">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
  {% if strength %}
    <div class="strength-meter">
      <span class="strength-meter-segment"></span>
      <span class="strength-meter-segment"></span>
      <span class="strength-meter-segment"></span>
      <span class="strength-meter-segment"></span>
    </div>
  {% endif %}
  {% if hint %}<p class="field-hint">{{ hint }}</p>{% endif %}
  {% if field.errors %}<ul class="errorlist">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
