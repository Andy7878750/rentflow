{% load billing %}
{% if not property.is_owner_used %}
  {% with tenants=property.tenants.all %}
    {% if tenants %}
      <ul class="property-tenants">
        {% for tenant in tenants %}
          <li>
            <span class="fade">{{ tenant.name }}</span>
            <span class="tenant-share">
              {{ tenant|tenant_share }}
            </span>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="property-tenants-empty">Арендаторов пока нет</p>
    {% endif %}
  {% endwith %}
{% endif %}
