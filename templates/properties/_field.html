{% with title=label|default:field.label %}
<div class="field fl{% if reveal or date %} fl-button{% elif unit_select %} fl-unit{% endif %}{% if class %} {{ class }}{% endif %}">
  <label for="{{ field.id_for_label }}">{{ title }}{% if required %} <span class="req">*</span>{% endif %}{% if tip %} <span class="help" tabindex="0" role="button" aria-label="Подсказка: {{ title }}" data-tip="{{ tip }}" data-tip-title="{{ title }}">?</span>{% endif %}</label>
  {% if reveal %}
    <div class="reveal-field">
      {{ field }}
      <button type="button" class="reveal-toggle" data-reveal aria-label="Показать подсказку">
        <svg class="icon icon-shown"><use href="#i-eye"/></svg>
        <svg class="icon icon-hidden"><use href="#i-eye-off"/></svg>
      </button>
    </div>
  {% elif date %}
    <div class="date-field">
      {{ field }}
      <button type="button" class="date-toggle" data-date-toggle aria-label="Открыть календарь">
        <svg class="icon"><use href="#i-calendar"/></svg>
      </button>
    </div>
  {% elif unit_select %}
    <div class="unit-input">
      <span class="unit-value">{{ field }}</span>
      <div class="unit-picker" data-unit-picker>
        <button type="button" class="unit-trigger" data-unit-trigger aria-haspopup="listbox" aria-expanded="false" aria-label="Единица доли">
          <span data-unit-label>{% if share_unit == 'area' %}м²{% else %}%{% endif %}</span>
          <svg class="icon select-chevron"><use href="#i-chevron-down"/></svg>
        </button>
        <ul class="select-menu unit-menu" role="listbox" data-unit-menu hidden>
          <li class="select-row" data-unit-value="percent"><button type="button" class="select-option" role="option"><span>Проценты, %</span><svg class="icon select-check"><use href="#i-check"/></svg></button></li>
          <li class="select-row" data-unit-value="area"><button type="button" class="select-option" role="option"><span>Площадь, м²</span><svg class="icon select-check"><use href="#i-check"/></svg></button></li>
        </ul>
      </div>
    </div>
    <span class="share-hint" data-share-hint></span>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.errors %}<ul class="errorlist">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
{% endwith %}
