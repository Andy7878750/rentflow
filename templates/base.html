<!DOCTYPE html>
{% load static %}
<html lang="ru">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RentFlow{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ static_version }}">

</html>
