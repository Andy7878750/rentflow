<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Услуги из формул</title>
<style>
:root {
  --color-primary: #34495e;
  --color-accent: #148f77;
  --color-accent-soft: #e6f4f1;
  --color-danger: #c0392b;
  --color-danger-soft: #fbecea;
  --color-bg: #f5f6f7;
  --color-surface: #ffffff;
  --color-border: #e1e4e8;
  --color-text: #2c3338;
  --color-text-muted: #6b7680;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: var(--color-bg); color: var(--color-text); line-height: 1.5; font-size: 14px; }
.page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 22px; color: var(--color-primary); }
.lead { margin: 0 0 20px; color: var(--color-text-muted); max-width: 760px; }
.cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--color-surface); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06); padding: 20px; }
.panel-title { margin: 0 0 12px; font-size: 18px; color: var(--color-primary); }

/* Blocks: frame, 12px corners, grey head in CAPS (.form-section in forms.css). */
.form-section { border: 1px solid var(--color-border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.form-section-head { margin: 0; padding: 8px 14px; background: #f7f8f9; border-bottom: 1px solid var(--color-border);
  font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-primary);
  display: flex; align-items: center; gap: 8px; }
.form-section-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }

/* Left: a quiet list of what the object has. */
.have { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.have li { display: flex; justify-content: space-between; gap: 8px; }
.have b { font-weight: 600; }
.have span { color: var(--color-text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Service */
.svc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.svc-name { border: 0; background: none; font: inherit; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-primary); padding: 0; width: 170px; outline: none; }
.seg-track { display: inline-flex; background: #eef0f2; border-radius: 8px; padding: 2px; gap: 2px; margin-left: auto; }
.seg-track button { height: 26px; border: 0; background: none; border-radius: 6px; padding: 0 10px; font: inherit; font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--color-text); cursor: pointer; white-space: nowrap; }
.seg-track button.on { background: var(--color-accent); color: #fff; }
.x { width: 24px; height: 24px; border: 0; background: none; color: var(--color-text-muted); font-size: 17px; cursor: pointer; border-radius: 6px; padding: 0; }
.x:hover { background: var(--color-danger-soft); color: var(--color-danger); }

/* Floating label field, 52px (.fl in forms.css). */
.fl { position: relative; display: block; }
.fl input { width: 100%; height: 52px; padding: 20px 12px 6px; border: 1px solid var(--color-border); border-radius: var(--radius);
  font: inherit; font-size: 15px; color: var(--color-text); background: #fff; outline: none; }
.fl input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); }
.fl label { position: absolute; left: 12px; top: 16px; color: var(--color-text-muted); font-size: 14px; pointer-events: none; transition: all .12s ease; }
.fl input:focus + label, .fl input:not(:placeholder-shown) + label { top: 6px; font-size: 11px; }
.fl.bad input { border-color: var(--color-danger); }

.hint { font-size: 12px; color: var(--color-text-muted); line-height: 1.8; }
.hint button { border: 0; background: none; padding: 0 2px; font: inherit; color: var(--color-accent); cursor: pointer; }
.hint button:hover { text-decoration: underline; }
.res { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.res li { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 8px; padding: 2px 0; }
.res .f { color: var(--color-text-muted); overflow-wrap: anywhere; }
.res b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.res li.total { border-bottom: 1px solid var(--color-border); padding-bottom: 4px; margin-bottom: 2px; }
.err { font-size: 13px; color: var(--color-danger); }
.add { border: 0; background: none; padding: 0; color: var(--color-accent); font: inherit; cursor: pointer; margin-bottom: 14px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); font-weight: 600; }
tr.total td { font-weight: 700; border-bottom: 0; }
.table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="page">
  <h1>Услуги из формул</h1>
  <p class="lead">Песочница. Формула пишется словами, как на бумаге: знаки + − × ÷ (можно * и /) и скобки.
    Под ней — та же строка с числами и итог. Слова слева можно нажимать под формулой. Ничего не сохраняется.</p>
  <div class="cols">
    <div class="panel" id="left"></div>
    <div class="panel" id="right"></div>
  </div>
</div>
<script>
(function () {
  // What the object has (in the app — separate steps: tenants, meters, tariffs, monthly input).
  var tenants = [ { id: 'v', name: 'Виктор', share: 45 }, { id: 'w', name: 'Владислав', share: 55 } ];
  var meters = [
    { word: 'ГВС', unit: 'м³', used: { v: 1, w: 2 } },
    { word: 'ХВС', unit: 'м³', used: { v: 4, w: 6 } }
  ];
  var consts = [
    { word: 'Тариф тепло', val: 4800, unit: '₽/Гкал' },
    { word: 'Тариф ГВС', val: 52, unit: '₽/м³' },
    { word: 'Подогрев', val: 0.06, unit: 'Гкал/м³' },
    { word: 'Водоотведение', val: 89, unit: '₽/м³' }
  ];
  var inputs = [ { word: 'Тепло', val: 0.42, unit: 'Гкал' } ];
  var services = [
    { name: 'Отопление', mode: 'common', text: '(Тепло − ГВС × Подогрев) × Тариф тепло' },
    { name: 'Горячая вода', mode: 'own', text: 'ГВС × Тариф ГВС + ГВС × Подогрев × Тариф тепло' },
    { name: 'Водоотведение', mode: 'own', text: '(ХВС + ГВС) × Водоотведение' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var kop = function (x) { return Math.sign(x) * Math.round(Math.abs(x) * 100 + 1e-9) / 100; };
  var rub = function (x) { return x.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽'; };
  var n4 = function (x) { return x.toLocaleString('ru-RU', { maximumFractionDigits: 4 }); };
  var sum = function (o) { return Object.keys(o).reduce(function (s, k) { return s + o[k]; }, 0); };

  // ---- units, only to say "the result is not in roubles" ----
  var SYM = { '₽': 'rub', 'Гкал': 'gcal', 'м³': 'm3', 'кВт·ч': 'kwh', 'м²': 'm2' };
  var BACK = { rub: '₽', gcal: 'Гкал', m3: 'м³', kwh: 'кВт·ч', m2: 'м²' };
  function unit(u) { var d = {}, p = u.split('/'); d[SYM[p[0]]] = 1; if (p[1]) d[SYM[p[1]]] = (d[SYM[p[1]]] || 0) - 1; return clean(d); }
  function clean(d) { var r = {}; for (var k in d) if (d[k]) r[k] = d[k]; return r; }
  // null = unknown unit (a bare number typed in the formula): then units are not checked
  function mul(a, b, s) { if (!a || !b) return null; var r = Object.assign({}, a); for (var k in b) r[k] = (r[k] || 0) + s * b[k]; return clean(r); }
  function same(a, b) { if (!a || !b) return true; var ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(function (k) { return a[k] === b[k]; }); }
  function show(d) { var up = [], dn = []; for (var k in d) (d[k] > 0 ? up : dn).push(BACK[k]); return up.length || dn.length ? (up.join('·') || '1') + (dn.length ? '/' + dn.join('·') : '') : 'просто число'; }

  // ---- words: longest match wins ("Тариф тепло" before "Тепло") ----
  function words() {
    return meters.map(function (m) { return { word: m.word, meter: m }; })
      .concat(consts.map(function (c) { return { word: c.word, c: c }; }), inputs.map(function (c) { return { word: c.word, c: c }; }))
      .sort(function (a, b) { return b.word.length - a.word.length; });
  }
  function tokenize(text) {
    var out = [], i = 0, list = words(), low = text.toLowerCase();
    while (i < text.length) {
      var ch = text[i];
      if (/\s/.test(ch)) { i++; continue; }
      if ('+-−–*×/÷:()'.indexOf(ch) >= 0) {
        out.push({ op: { '-': '−', '–': '−', '*': '×', '/': '÷', ':': '÷' }[ch] || ch }); i++; continue;
      }
      var m = /^(?:\d{1,3}(?:[  ]\d{3})+(?!\d)|\d+)(?:[.,]\d+)?/.exec(text.slice(i));
      if (m) { out.push({ num: parseFloat(m[0].replace(/[  ]/g, '').replace(',', '.')) }); i += m[0].length; continue; }
      var hit = list.find(function (w) { return low.startsWith(w.word.toLowerCase(), i); });
      if (hit) { out.push({ w: hit }); i += hit.word.length; continue; }
      var bad = /^[^\s+\-−–*×/÷:()]+/.exec(text.slice(i))[0];
      throw 'Не знаю слова «' + bad + '»';
    }
    return out;
  }

  // value of a token: a meter word means all meters (common sum) or the tenant's own (each by own meter)
  function val(t, tenant) {
    if (t.num !== undefined) return { v: t.num, u: null };
    if (t.w.meter) return { v: tenant ? t.w.meter.used[tenant.id] || 0 : sum(t.w.meter.used), u: unit(t.w.meter.unit) };
    return { v: t.w.c.val, u: unit(t.w.c.unit) };
  }
  function calc(text, tenant) {
    var toks = tokenize(text), p = 0;
    if (!toks.length) throw 'Напишите формулу';
    var shown = toks.map(function (t) { return t.op || n4(val(t, tenant).v); }).join(' ').replace(/\( /g, '(').replace(/ \)/g, ')');
    function isOp(set) { return toks[p] && toks[p].op && set.indexOf(toks[p].op) >= 0; }
    function factor() {
      var t = toks[p++];
      if (!t) throw 'Формула не закончена';
      if (t.op === '(') { var v = expr(); if (!toks[p] || toks[p++].op !== ')') throw 'Не хватает «)»'; return v; }
      if (t.op === '−') { var f = factor(); return { v: -f.v, u: f.u }; }
      if (t.op) throw 'Лишний знак «' + t.op + '»';
      return val(t, tenant);
    }
    function term() {
      var a = factor();
      while (isOp('×÷')) {
        var o = toks[p++].op, b = factor();
        if (o === '÷' && !b.v) throw 'Деление на ноль';
        a = o === '×' ? { v: a.v * b.v, u: mul(a.u, b.u, 1) } : { v: a.v / b.v, u: mul(a.u, b.u, -1) };
      }
      return a;
    }
    function expr() {
      var a = term();
      while (isOp('+−')) {
        var o = toks[p++].op, b = term();
        if (!same(a.u, b.u)) throw 'Нельзя ' + (o === '+' ? 'сложить' : 'вычесть') + ' ' + show(a.u) + ' и ' + show(b.u);
        a = { v: o === '+' ? a.v + b.v : a.v - b.v, u: a.u && b.u ? a.u : null };
      }
      return a;
    }
    var r = expr();
    if (p < toks.length) throw toks[p].op === ')' ? 'Лишняя «)»' : 'Между словами не хватает знака';
    if (!same(r.u, { rub: 1 })) throw 'В итоге получается ' + show(r.u) + ', а нужны рубли';
    return { v: kop(r.v), shown: shown };
  }

  function bill(s) {
    var b = { per: {}, owner: 0, lines: [], error: null };
    try {
      if (s.mode === 'common') {
        var r = calc(s.text, null), given = 0;
        b.lines.push({ who: 'Всего', f: r.shown + ' =', v: r.v, total: true });
        tenants.forEach(function (t) {
          var part = kop(r.v * t.share / 100); b.per[t.id] = part; given += part;
          b.lines.push({ who: t.name, f: t.share + '%', v: part });
        });
        b.owner = kop(r.v - given);
        if (b.owner) b.lines.push({ who: 'Собственник', f: 'остаток', v: b.owner });
      } else {
        tenants.forEach(function (t) {
          var r = calc(s.text, t); b.per[t.id] = r.v;
          b.lines.push({ who: t.name, f: r.shown + ' =', v: r.v });
        });
      }
    } catch (e) { b.error = String(e); }
    return b;
  }

  function renderLeft() {
    var li = function (a, b) { return '<li><b>' + esc(a) + '</b><span>' + esc(b) + '</span></li>'; };
    $('left').innerHTML = '<h2 class="panel-title">Королёва 61</h2>' +
      '<section class="form-section"><h3 class="form-section-head">Арендаторы</h3><div class="form-section-body"><ul class="have">' +
        tenants.map(function (t) { return li(t.name, t.share + '%'); }).join('') + '</ul></div></section>' +
      '<section class="form-section"><h3 class="form-section-head">Счётчики · расход</h3><div class="form-section-body"><ul class="have">' +
        meters.map(function (m) {
          return li(m.word, tenants.map(function (t) { return t.name + ' ' + n4(m.used[t.id] || 0); }).join(' · ') + ' ' + m.unit);
        }).join('') + '</ul></div></section>' +
      '<section class="form-section"><h3 class="form-section-head">Тарифы и нормативы</h3><div class="form-section-body"><ul class="have">' +
        consts.map(function (c) { return li(c.word, n4(c.val) + ' ' + c.unit); }).join('') + '</ul></div></section>' +
      '<section class="form-section"><h3 class="form-section-head">Из квитанции · месяц</h3><div class="form-section-body"><ul class="have">' +
        inputs.map(function (c) { return li(c.word, n4(c.val) + ' ' + c.unit); }).join('') + '</ul></div></section>';
  }

  function resultHtml(b) {
    if (b.error) return '<div class="err">' + esc(b.error) + '</div>';
    return '<ul class="res">' + b.lines.map(function (l) {
      return '<li' + (l.total ? ' class="total"' : '') + '><span>' + esc(l.who) + '</span><span class="f">' + esc(l.f) + '</span><b>' + rub(l.v) + '</b></li>';
    }).join('') + '</ul>';
  }

  function renderRight() {
    var h = '<h2 class="panel-title">Услуги · сентябрь 2026</h2>';
    var hint = words().slice().sort(function (a, b) { return a.word.localeCompare(b.word, 'ru'); })
      .map(function (w) { return '<button type="button" data-word="' + esc(w.word) + '">' + esc(w.word) + '</button>'; }).join(' · ');
    services.forEach(function (s, i) {
      var b = bill(s);
      h += '<section class="form-section" data-i="' + i + '"><h3 class="form-section-head svc-head">' +
        '<input class="svc-name" data-name value="' + esc(s.name) + '">' +
        '<span class="seg-track"><button type="button" data-mode="common" class="' + (s.mode === 'common' ? 'on' : '') + '">Общая сумма, по долям</button>' +
        '<button type="button" data-mode="own" class="' + (s.mode === 'own' ? 'on' : '') + '">Каждому по своему счётчику</button></span>' +
        '<button type="button" class="x" data-del aria-label="Убрать услугу">×</button></h3><div class="form-section-body">' +
        '<div class="fl' + (b.error ? ' bad' : '') + '"><input data-text id="f' + i + '" placeholder=" " autocomplete="off" spellcheck="false" value="' + esc(s.text) + '"><label for="f' + i + '">Формула</label></div>' +
        '<div class="hint">Можно: ' + hint + '</div>' +
        '<div data-res>' + resultHtml(b) + '</div></div></section>';
    });
    h += '<button type="button" class="add" data-add>+ Добавить услугу</button><div id="summary"></div>';
    $('right').innerHTML = h;
    renderSummary();
  }

  function renderSummary() {
    var bills = services.map(bill), owner = 0;
    var h = '<section class="form-section"><h3 class="form-section-head">Счета за месяц</h3><div class="form-section-body"><div class="table-wrap"><table><tr><th>Кто</th>' +
      services.map(function (s) { return '<th>' + esc(s.name) + '</th>'; }).join('') + '<th>Итого</th></tr>';
    var row = function (name, get) {
      var t = 0;
      var cells = bills.map(function (b) { if (b.error) return '<td>—</td>'; var v = get(b); t += v; return '<td>' + rub(v) + '</td>'; }).join('');
      return { html: '<td>' + esc(name) + '</td>' + cells + '<td><b>' + rub(kop(t)) + '</b></td>', t: t };
    };
    var all = 0;
    tenants.forEach(function (tn) { var r = row(tn.name, function (b) { return b.per[tn.id] || 0; }); all += r.t; h += '<tr>' + r.html + '</tr>'; });
    bills.forEach(function (b) { if (!b.error) owner += b.owner; });
    if (owner) { var r = row('Собственник', function (b) { return b.owner; }); all += r.t; h += '<tr>' + r.html + '</tr>'; }
    h += '<tr class="total">' + row('Всего', function (b) { return kop(b.owner + sum(b.per)); }).html + '</tr></table></div></div></section>';
    $('summary').innerHTML = h;
  }

  function refresh(sec) {
    var s = services[+sec.dataset.i], b = bill(s);
    sec.querySelector('[data-res]').innerHTML = resultHtml(b);
    sec.querySelector('.fl').classList.toggle('bad', !!b.error);
    renderSummary();
  }

  document.addEventListener('input', function (e) {
    var sec = e.target.closest('[data-i]'); if (!sec) return;
    var s = services[+sec.dataset.i];
    if (e.target.hasAttribute('data-text')) { s.text = e.target.value; refresh(sec); }
    if (e.target.hasAttribute('data-name')) { s.name = e.target.value; renderSummary(); }
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    if (el.hasAttribute('data-add')) { services.push({ name: 'Своя услуга', mode: 'common', text: '' }); renderRight(); $('f' + (services.length - 1)).focus(); return; }
    var sec = el.closest('[data-i]'); if (!sec) return;
    var i = +sec.dataset.i, s = services[i];
    if (el.dataset.mode) { s.mode = el.dataset.mode; renderRight(); }
    else if (el.hasAttribute('data-del')) { services.splice(i, 1); renderRight(); }
    else if (el.dataset.word) {
      // insert the word where the cursor was
      var f = sec.querySelector('[data-text]'), at = f.selectionStart == null ? f.value.length : f.selectionStart;
      var before = f.value.slice(0, at), after = f.value.slice(f.selectionEnd || at);
      var ins = (before && !/\s$/.test(before) ? ' ' : '') + el.dataset.word + ' ';
      f.value = before + ins + after; s.text = f.value;
      f.focus(); f.setSelectionRange(before.length + ins.length, before.length + ins.length);
      refresh(sec);
    }
  });
  // keep the cursor position when a hint word is pressed (mousedown would blur the field first)
  document.addEventListener('mousedown', function (e) { if (e.target.closest('.hint button')) e.preventDefault(); });

  renderLeft();
  renderRight();
})();
</script>
</body>
</html>
