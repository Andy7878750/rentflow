<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кто платит по счётчику — варианты</title>
<style>
/* Макет 2026-11-19: «По счётчикам» в окне услуг — как привязать счётчик к арендатору. Варианты А и Б.
   Что мешало: всё по умолчанию «Общий · по долям», выбор спрятан за кликом по строке (›), рядом ещё и тумблер. */
:root { --primary: #34495e; --accent: #148f77; --accent-soft: #e6f4f1; --bg: #f5f6f7; --border: #e1e4e8; --text: #2c3338;
  --muted: #6b7680; --warm: #fff8e6; --warm-b: #ecd9a8; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 var(--font); color: var(--text); background: #8a9299; padding: 20px 16px 60px; }
.page { max-width: 820px; margin: 0 auto; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs button { height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: rgba(255,255,255,.85); font: 600 13px var(--font); cursor: pointer; }
.tabs button.on { background: var(--accent); color: #fff; }
.about { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.about div { background: #fff; border-radius: var(--radius); padding: 8px 12px; font-size: 13px; }
.about b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
.about .p b { color: var(--accent); } .about .m b { color: #c0392b; }
.win { background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 20px 32px 28px; }
h3 { margin: 0 0 8px; height: 20px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
svg.i { width: 18px; height: 18px; flex-shrink: 0; }
.gp { padding: 6px 14px; border-radius: var(--radius); background: #f1f3f5; font-size: 13.5px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 200px; align-items: center; gap: 12px; min-height: 44px; }
.row + .row { border-top: 1px solid #e3e6e9; }
.row.head { min-height: 28px; font-size: 12px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.who b { font-weight: 600; } .sub { font-size: 12px; color: var(--muted); }
.r { text-align: right; } .tariff { font-size: 13px; text-align: right; white-space: nowrap; }
/* выбор «Кто платит» прямо в строке — своё меню, как везде */
.pick { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
.pick.empty { background: var(--warm); border-color: var(--warm-b); color: #9a7b2f; }
.pick.off { color: var(--muted); background: transparent; }
.pick .chev { color: var(--muted); font-size: 10px; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 5; width: 230px; padding: 6px; background: #fff; border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.14); }
.menu div { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text); }
.menu div:hover { background: var(--bg); }
.menu div.sel { background: #eceef1; font-weight: 600; }
.menu div small { color: var(--muted); font-weight: 400; }
.menu .sep { height: 1px; padding: 0; margin: 4px 6px; background: var(--border); cursor: default; }
.menu .cap { padding: 6px 12px 2px; font-size: 11px; color: var(--muted); cursor: default; }
.menu .cap:hover { background: none; }
/* Б: группы */
.grp { border: 1px solid var(--border); border-radius: var(--radius); }
.grp + .grp { margin-top: 8px; }
.grp-h { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; font-weight: 600; }
.grp-h .no { width: 22px; height: 22px; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 400; }
.grp-h .meta { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
.grp-h a { color: var(--accent); font-size: 13px; font-weight: 600; }
.grp-b { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 12px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
  background: #fff; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: #c3c9cf; }
.chip .chev { color: var(--muted); font-size: 10px; }
.chip.add { border-style: dashed; color: var(--accent); font-weight: 600; }
.grp.common { background: #fafbfc; }
.grp.free { background: var(--bg); }
.grp.free .chip { color: var(--muted); }
.grp.todo { border-color: var(--warm-b); background: var(--warm); }
.grp.todo .grp-h { color: #9a7b2f; }
.empty-txt { font-size: 12px; color: #aab2ba; padding: 6px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="tabs" id="tabs"></div>
  <div class="about" id="about"></div>
  <div class="win" id="win"></div>
</div>
<script>
(function () {
  var IC = { el: ['#0e9aa7', '<path fill="currentColor" d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>'],
             cold: ['#2e86c1', '<path fill="currentColor" d="M12 2.5c-.3 0-.6.2-.8.4C9.4 5.3 5.5 10.4 5.5 14.5a6.5 6.5 0 0 0 13 0c0-4.1-3.9-9.2-5.7-11.6-.2-.2-.5-.4-.8-.4z"/>'],
             hot: ['#c0392b', '<path fill="currentColor" d="M12 2.5c-.3 0-.6.2-.8.4C9.4 5.3 5.5 10.4 5.5 14.5a6.5 6.5 0 0 0 13 0c0-4.1-3.9-9.2-5.7-11.6-.2-.2-.5-.4-.8-.4z"/>'] };
  var ic = function (k) { return '<svg class="i" viewBox="0 0 24 24" style="color:' + IC[k][0] + '">' + IC[k][1] + '</svg>'; };
  var T = [{ id: 'v', name: 'Виктор' }, { id: 'w', name: 'Влад' }];
  // who: id арендатора · 'common' · 'owner' · '' (не выбран) · 'off' (не в услуге); svc — уже в другой услуге
  var M = [
    { id: 1, k: 'el', no: '258369-2', name: 'Электричество · день / ночь', tar: '6,9 / 9,8 ₽/кВт·ч', who: 'v' },
    { id: 2, k: 'el', no: '789654', name: 'Электричество', tar: '9,6 ₽/кВт·ч', who: 'w' },
    { id: 3, k: 'cold', no: '258741', name: 'Вода холодная', tar: '55,9 ₽/м³', who: '' },
    { id: 4, k: 'cold', no: '789655', name: 'Вода холодная', tar: '55,9 ₽/м³', who: 'common' },
    { id: 5, k: 'hot', no: '789874-9', name: 'Вода горячая', tar: '70,5 ₽/м³', svc: 'Горячая вода' },
    { id: 6, k: 'hot', no: '258963', name: 'Вода горячая', tar: '70,5 ₽/м³', svc: 'Горячая вода' }
  ];
  var cur = 'A', open = null;
  var whoText = function (w) { return w === 'common' ? 'Общий · по долям' : w === 'owner' ? 'Платите вы' : w === 'off' ? 'Не в услуге' : w ? T.filter(function (t) { return t.id === w; })[0].name : 'Выберите'; };
  function menu(m) {
    var opt = function (v, label, small) { return '<div data-set="' + m.id + ':' + v + '"' + (m.who === v ? ' class="sel"' : '') + '>' + label + (small ? '<small>' + small + '</small>' : (m.who === v ? '✓' : '')) + '</div>'; };
    return '<div class="menu"><div class="cap">Платит арендатор</div>' + T.map(function (t) { return opt(t.id, t.name); }).join('') +
      '<div class="sep"></div>' + opt('common', 'Общий — делим', 'окно «Делим»') + opt('owner', 'Платите вы') +
      '<div class="sep"></div>' + opt('off', 'Не в этой услуге') + '</div>';
  }
  var V = {
    A: ['А · «Кто платит» — меню прямо в строке (советую)',
      'Видно сразу, чей счётчик, и менять — там же: одно меню вместо клика по строке + тумблера. Новый счётчик не «Общий», а жёлтое «Выберите ▾» — как пустое числовое поле: глаз сам цепляется. «Общий — делим» открывает уже готовое окно «Делим».',
      'Меню на каждой строке — при 10+ счётчиках длинный список (но всё равно один клик на счётчик).',
      function () {
        var rows = M.map(function (m) {
          if (m.svc) return '<div class="row" style="color:var(--muted)"><span class="who">' + ic(m.k) + '№ ' + m.no + ' <span class="sub">' + m.name + '</span></span><span class="tariff">' + m.tar + '</span><span>в «' + m.svc + '»</span></div>';
          var cls = m.who === '' ? ' empty' : m.who === 'off' ? ' off' : '';
          return '<div class="row"><span class="who">' + ic(m.k) + '<b>№ ' + m.no + '</b> <span class="sub">' + m.name + '</span></span><span class="tariff">' + m.tar + '</span>' +
            '<span class="pick' + cls + '" data-open="' + m.id + '"><span>' + whoText(m.who) + '</span><span class="chev">▾</span>' + (open === m.id ? menu(m) : '') + '</span></div>';
        }).join('');
        return '<h3>Счётчики объекта</h3><div class="gp"><div class="row head"><span>Счётчик</span><span class="r">Тариф</span><span>Кто платит</span></div>' + rows + '</div>' +
          '<p class="hint">Тумблера «Вкл.» нет: «Не в этой услуге» — в том же меню. Жёлтое «Выберите» — счётчик ещё ничей, услуга не посчитается.</p>';
      }],
    B: ['Б · Группы: у кого какие счётчики',
      'Ответ на вопрос «что платит Виктор?» виден сразу: блок арендатора и его счётчики-плашки. «+ счётчик» в блоке — добавить ему. Нажал на плашку — меню «Перенести к…».',
      'Привязка «от арендатора» — тариф и № мельче; плашки занимают место; новые счётчики сверху жёлтым блоком «Не выбрано».',
      function () {
        var chip = function (m) { return '<span class="chip" data-open="' + m.id + '">' + ic(m.k) + '№ ' + m.no + ' <span class="sub">' + m.tar + '</span><span class="chev">▾</span>' + (open === m.id ? menu(m) : '') + '</span>'; };
        var group = function (cls, head, list, add) {
          return '<div class="grp ' + cls + '"><div class="grp-h">' + head + '</div><div class="grp-b">' + (list.length ? list.map(chip).join('') : '<span class="empty-txt">нет счётчиков</span>') +
            (add ? '<span class="chip add">+ счётчик</span>' : '') + '</div></div>';
        };
        var by = function (w) { return M.filter(function (m) { return !m.svc && m.who === w; }); };
        var h = '';
        if (by('').length) h += group('todo', '⚠ Не выбрано, кто платит', by(''));
        T.forEach(function (t, i) { h += group('', '<span class="no">' + (i + 1) + '</span>' + t.name, by(t.id), true); });
        h += group('common', 'Общие — делим<span class="meta">по долям · <a>изменить</a></span>', by('common'), true);
        if (by('owner').length) h += group('common', 'Платите вы', by('owner'));
        h += group('free', 'Не в этой услуге', by('off').concat(M.filter(function (m) { return m.svc; })));
        return '<h3>Счётчики · кто платит</h3>' + h;
      }]
  };
  function render() {
    document.getElementById('tabs').innerHTML = Object.keys(V).map(function (k) { return '<button data-v="' + k + '"' + (k === cur ? ' class="on"' : '') + '>' + V[k][0] + '</button>'; }).join('');
    document.getElementById('about').innerHTML = '<div class="p"><b>Плюс</b>' + V[cur][1] + '</div><div class="m"><b>Минус</b>' + V[cur][2] + '</div>';
    document.getElementById('win').innerHTML = V[cur][3]();
  }
  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-v]'))) { cur = t.dataset.v; open = null; return render(); }
    if ((t = e.target.closest('[data-set]'))) { var p = t.dataset.set.split(':'); M.filter(function (m) { return m.id === +p[0]; })[0].who = p[1]; open = null; return render(); }
    if ((t = e.target.closest('[data-open]'))) { open = open === +t.dataset.open ? null : +t.dataset.open; return render(); }
    if (open !== null) { open = null; render(); }
  });
  render();
})();
</script>
</body>
</html>
