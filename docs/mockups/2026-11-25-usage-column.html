<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Счётчики «по расходу» — варианты, 2026-11-25</title>
<style>
  :root { --primary:#34495e; --accent:#148f77; --accent-text:#117965; --accent-soft:#e6f4f1; --bg:#f5f6f7; --border:#e1e4e8;
    --text:#2c3338; --muted:#6b7680; --warm:#fffbe6; --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); font-size:14px; }
  .top { max-width:1240px; margin:0 auto; padding:24px 16px 8px; }
  h1 { margin:0 0 4px; font-size:20px; color:var(--primary); }
  .lead { margin:0; color:var(--muted); line-height:1.5; }
  .grid { max-width:1240px; margin:0 auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(560px, 1fr)); gap:24px; }
  .var > h2 { margin:0 0 4px; font-size:15px; color:var(--primary); display:flex; align-items:center; gap:8px; }
  .var > p { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.45; min-height:56px; }
  .rec { font-size:11px; font-weight:600; border-radius:999px; padding:2px 8px; background:var(--accent-soft); color:var(--accent-text); }

  .box { background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .cols { display:grid; grid-template-columns:minmax(0,1fr) 72px 100px 100px; column-gap:10px; align-items:center; }
  .head { height:34px; padding:0 16px; background:var(--bg); border-bottom:1px solid var(--border); color:var(--muted);
    font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  .head span + span { text-align:right; }
  .body { padding:2px 16px; }
  .grp { padding:10px 0; }
  .grp + .grp { border-top:1px solid var(--border); }
  .gname { display:flex; align-items:center; gap:8px; padding-bottom:4px; font-size:15px; font-weight:600; color:var(--primary); }
  .gname svg { width:18px; height:18px; flex:none; }
  .gname .gu { font-size:12px; font-weight:400; color:var(--muted); }
  .row { padding:4px 0; }
  .who { padding-left:26px; min-width:0; }
  .who b { display:block; font-size:13px; color:var(--primary); }
  .who small { display:block; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .num { text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .num.dark { font-size:14px; font-weight:600; color:var(--text); }
  .num i { font-style:normal; font-size:11px; font-weight:400; color:var(--muted); margin-left:3px; }
  .inp { position:relative; height:38px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:flex-end;
    padding:0 10px; font-size:15px; font-variant-numeric:tabular-nums; background:#fff; }
  .inp .pre { color:var(--accent); margin-right:auto; }
  .inp .word { margin-right:auto; font-size:11px; color:var(--muted); }
  .inp .u { font-size:11px; color:var(--muted); margin-left:4px; }
  .pill { justify-self:end; font-size:11px; background:#eef0f2; border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .note { margin-top:10px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></symbol>
</svg>

<div class="top">
  <h1>Счётчики «по расходу» — варианты</h1>
  <p class="lead">Шапка во всех вариантах Б–Г: <b>Прошлые · Текущие · Расход</b> вместо «Было · Стало» (было похоже, что «Было» тоже надо вписывать).
    Электричество вводится расходом за месяц (сейчас — поле с «+»), горячая вода — текущими показаниями.</p>
</div>
<div class="grid" id="grid"></div>

<script>
  // [name, №, previous, typed, usage, new reading]
  var EL = { icon:'bolt', color:'#0e9aa7', name:'Электричество', unit:'кВт·ч', plus:true,
    rows:[['Салон «Ногти»','№ 013117','99 102','25','25','99 127'],['Аптека «Вита»','№ 58008028','343 873','45','45','343 918']] };
  var HW = { icon:'drop', color:'#d9534f', name:'Вода горячая', unit:'м³', plus:false,
    rows:[['Салон «Ногти»','№ 254125-65 · 80,7 ₽/м³','241','243','2','243'],['Аптека «Вита»','№ 1147899 · 80,7 ₽/м³','202','210','8','210']] };

  function gname(g, extra) {
    return '<div class="gname"><svg style="color:' + g.color + '"><use href="#' + g.icon + '"/></svg>' + g.name + (extra || '') + '</div>';
  }
  function who(r) { return '<div class="who"><b>' + r[0] + '</b><small>' + r[1] + '</small></div>'; }
  // a normal (current readings) row, the same in Б–Г
  function normal(r, g) {
    return '<div class="row cols">' + who(r) + '<div class="num">' + r[2] + '</div><div class="inp">' + r[3] + '</div><div class="num dark">' + r[4] + '<i>' + g.unit + '</i></div></div>';
  }

  var V = [
    { k:'a', t:'А · сейчас', p:'«Было / Стало», у расхода — «+» в поле и тот же расход ещё раз плашкой справа. «+» не всегда понятен: «прибавить? к чему?».',
      head:['Показания счётчиков','Было','Стало','Расход'],
      el: function (r, g) { return '<div class="row cols">' + who(r) + '<div class="num">' + r[2] + '</div><div class="inp"><span class="pre">+</span>' + r[3] + '</div><span class="pill">' + r[4] + ' ' + g.unit + '</span></div>'; },
      hw: function (r, g) { return '<div class="row cols">' + who(r) + '<div class="num">' + r[2] + '</div><div class="inp">' + r[3] + '</div><span class="pill">' + r[4] + ' ' + g.unit + '</span></div>'; } },

    { k:'b', t:'Б · поле — в столбце «Расход»', rec:'предлагаю', p:'Вводят расход — значит поле стоит под словом «Расход». В «Текущих» серым — каким стало показание (посчитал RentFlow). Ничего не надо объяснять. Минус: у этой группы поле правее, чем у соседних.',
      head:['Показания счётчиков','Прошлые','Текущие','Расход'],
      el: function (r, g) { return '<div class="row cols">' + who(r) + '<div class="num">' + r[2] + '</div><div class="num">' + r[5] + '</div><div class="inp">' + r[3] + '<span class="u">' + g.unit + '</span></div></div>'; },
      hw: normal },

    { k:'c', t:'В · поле на месте, в нём слово «расход»', p:'Поле там же, где у всех (под «Текущие»), но вместо «+» внутри серое «расход». В «Расходе» справа — каким стало показание: «→ 99 127». Столбец полей ровный, но шапка над полем говорит «Текущие».',
      head:['Показания счётчиков','Прошлые','Текущие','Расход'],
      el: function (r) { return '<div class="row cols">' + who(r) + '<div class="num">' + r[2] + '</div><div class="inp"><span class="word">расход</span>' + r[3] + '</div><div class="num">→ ' + r[5] + '</div></div>'; },
      hw: normal },

    { k:'d', t:'Г · подсказка у группы', p:'Поле на месте и без знака; после названия группы серым «· вводите расход за месяц». Справа — показание «→ 99 127». Пояснение одно на группу, а не в каждой строке.',
      head:['Показания счётчиков','Прошлые','Текущие','Расход'], elHead:'<span class="gu">· вводите расход за месяц</span>',
      el: function (r) { return '<div class="row cols">' + who(r) + '<div class="num">' + r[2] + '</div><div class="inp">' + r[3] + '</div><div class="num">→ ' + r[5] + '</div></div>'; },
      hw: normal }
  ];

  document.getElementById('grid').innerHTML = V.map(function (v) {
    var body = '<div class="grp">' + gname(EL, v.elHead) + EL.rows.map(function (r) { return v.el(r, EL); }).join('') + '</div>' +
               '<div class="grp">' + gname(HW) + HW.rows.map(function (r) { return v.hw(r, HW); }).join('') + '</div>';
    return '<section class="var"><h2>' + v.t + (v.rec ? ' <span class="rec">' + v.rec + '</span>' : '') + '</h2><p>' + v.p + '</p>' +
      '<div class="box"><div class="head cols">' + v.head.map(function (h) { return '<span>' + h + '</span>'; }).join('') + '</div><div class="body">' + body + '</div></div></section>';
  }).join('');
</script>
</body>
</html>
