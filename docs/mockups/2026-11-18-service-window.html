<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Окно услуг — макет</title>
<style>
:root {
  --primary: #34495e; --accent: #148f77; --accent-soft: #e6f4f1;
  --bg: #f5f6f7; --surface: #fff; --border: #e1e4e8; --text: #2c3338; --muted: #6b7680;
  --warm: #fffbe6; --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 var(--font); color: var(--text); background: #8a9299; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* окно */
.win { width: 1060px; height: 720px; max-width: 100%; background: var(--surface); border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; }
.win-head { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--border); }
.win-head h1 { margin: 0; font-size: 17px; font-weight: 600; color: var(--primary); }
.win-head h1 span { color: var(--muted); font-weight: 400; }
.x { width: 32px; height: 32px; border: 0; background: none; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; }
.x:hover { background: var(--bg); }
.win-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px 1fr; }

/* левое меню */
.nav { border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
.nav-cap { font-size: 12px; color: var(--muted); padding: 4px 10px 6px; }
.nav-sep { height: 1px; background: var(--border); margin: 10px 10px 12px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius);
  cursor: pointer; color: var(--text); user-select: none; }
.nav-item:hover { background: var(--bg); }
.nav-item .fade { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.nav-item.is-active { background: #eceef0; font-weight: 600; }
.nav-item.is-mode .i { color: var(--muted); }
.nav-item.is-mode.is-on { color: var(--accent); font-weight: 600; }
.nav-item.is-mode.is-on .i { color: var(--accent); }
.nav-item .check { color: var(--accent); font-size: 14px; }
.nav-item.is-add { color: var(--accent); font-weight: 600; }

/* правая часть */
.pane { overflow-y: auto; container-type: inline-size; }
.top { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--border); padding: 0 32px; }
.top-line { display: flex; align-items: center; gap: 8px; height: 52px; }
.top-line .name { font-size: 15px; font-weight: 600; color: var(--primary); white-space: nowrap; }
.top-line .prov { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-icon { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px;
  color: var(--accent); cursor: pointer; border: 0; background: none; padding: 0; }
.head-icon:hover { background: var(--accent-soft); }
.head-icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.saved { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; transition: color .2s; }
.saved.is-on { color: var(--accent); }
.top-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 0 14px; }

.body { padding: 20px 32px 32px; display: flex; flex-direction: column; gap: 24px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.cp { display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 12px 14px; border-radius: var(--radius);
  background: #f1f3f5; font-size: 13.5px; }
.cp > .i { color: var(--accent); margin: 0 2px; } /* та же колонка 22px, что у номеров ниже */
.cp b { font-weight: 600; }
.cp .num-wrap { width: 180px; margin-left: 4px; }
.cp .num-wrap input { font-size: 15px; }
.cp .num-wrap.w-tariff { width: 130px; }
.cp .num-wrap.w-vol { width: 130px; margin-left: 0; }
.cp .op { color: var(--muted); }
.cp .cp-total { margin-left: auto; font-size: 15px; font-weight: 600; white-space: nowrap; }
/* «На странице объекта» — копия карточки «Ввода за месяц» */
.pv-card { width: 50%; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; pointer-events: none; user-select: none; }
.pv-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.pv-head .badge { text-transform: none; letter-spacing: 0; }
.pv-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; }
.pv-who { display: flex; flex-direction: column; min-width: 0; }
.pv-name { display: flex; align-items: center; gap: 6px; font-weight: 600; min-width: 0; }
.pv-name .fade { white-space: nowrap; overflow: hidden; }
.pv-pen svg { width: 14px; height: 14px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.pv-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.pv-field { position: relative; height: 38px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--warm);
  display: flex; align-items: center; justify-content: flex-end; padding-right: 30px; }
.pv-ph { color: #b3bac1; font-size: 14px; }
.pv-sum { text-align: right; font-weight: 600; }
.sec > h3 { display: flex; align-items: center; gap: 8px; height: 20px; } /* = высота метки: с меткой и без — одинаково */
/* метка-предупреждение (.badge-warn): светлый оранжевый фон, иконка, обычный регистр */
.badge-warn { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px;
  background: #fff4e5; color: #b9770e; font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0; cursor: help; }
/* метка-пример: серая, тихая; суммы от примера — бледные */
.badge-sample { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; background: #eceef0;
  color: var(--muted); font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.gp-row .sum.is-sample, .gp-row.is-owner.can-pass:not(.is-off) .sum.is-sample { color: #b3bac1; font-weight: 400; }
.badge-warn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
/* выбор единицы — своё выпадающее меню, как .select-menu в формах: ✓ у выбранного, × у своих, «+ свой вариант…» внизу */
.sel-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: 220px; padding: 6px; background: #fff;
  border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.14); }
.sel-menu ul { margin: 0; padding: 0; list-style: none; }
.sel-row { display: flex; align-items: center; border-radius: 8px; }
.sel-row:hover { background: var(--bg); }
.sel-row.is-selected { background: #eceef1; }
.sel-opt { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 0; background: none;
  font: 14px var(--font); color: var(--text); text-align: left; cursor: pointer; }
.sel-opt .ck { visibility: hidden; color: var(--primary); width: 16px; height: 16px; }
.sel-row.is-selected .sel-opt { font-weight: 600; }
.sel-row.is-selected .ck { visibility: visible; }
.sel-remove { width: 24px; height: 24px; margin-right: 8px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: #fff;
  color: #c0392b; cursor: pointer; font-size: 14px; line-height: 1; }
.sel-remove:hover { border-color: #c0392b; background: #fdecea; }
.sel-add { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 4px 0 12px; border-top: 1px solid var(--border); color: var(--accent); }
.sel-add .plus { font-weight: 700; }
.sel-add input { flex: 1; min-width: 0; height: 32px; border: 0; outline: none; font: 14px var(--font); background: none; }
.sel-add input::placeholder { color: #9aa3ab; }
.sel-add-btn { border: 0; background: none; color: var(--accent); font: 700 13px var(--font); cursor: pointer; padding: 4px 6px; }
.sel-add-btn:hover { text-decoration: underline; }
.unit-pick { position: relative; }
.pick { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; width: 100px; height: 38px; padding: 0 10px 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius); background: #fff; font: 600 14px var(--font); color: var(--text); cursor: pointer; }
.pick:hover { border-color: #c3c9cf; }
.pick .chev { color: var(--muted); font-size: 11px; font-weight: 400; }
.pick-menu { position: absolute; top: 42px; left: 0; z-index: 5; min-width: 140px; padding: 4px; background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.pick-menu button { display: flex; justify-content: space-between; align-items: center; height: 34px; padding: 0 10px; border: 0; background: none;
  border-radius: 6px; font: 14px var(--font); color: var(--text); cursor: pointer; text-align: left; }
.pick-menu button:hover { background: var(--bg); }
.pick-menu button.is-on { color: var(--accent); font-weight: 600; }
.pick-menu button:last-child { color: var(--accent); }
/* своя единица: та же ширина и вид, что у выбора (100px), крестик — на месте стрелки ▾ */
.unit-own { position: relative; display: inline-block; width: 100px; }
.unit-own input { width: 100%; height: 38px; padding: 0 30px 0 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font: 600 14px var(--font); color: var(--text); outline: none; background: #fff; }
.unit-own input::placeholder { font-weight: 400; color: #9aa3ab; }
.unit-own input:placeholder-shown { background: var(--warm); }
.unit-own input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.unit-x { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border: 0; background: none;
  display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; border-radius: 4px; padding: 0; }
.num-wrap input::placeholder { font-weight: 400; color: #9aa3ab; }
.unit-x:hover { background: var(--bg); }
/* «Делим и кто платит» — строка способов с иконкой; иконка над галочками, способы над именами */
/* всё в одной серой панели (как «Как начисляется»), строки 40px без рамок (32 + 4px сверху и снизу) */
.gp { padding: 6px 14px; border-radius: var(--radius); background: #f1f3f5; font-size: 13.5px; }
.split-top { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.split-top > .i { color: var(--accent); margin: 0 2px; } /* = столбец номера 22px: способы ровно над именами */
.gp-row .no { width: 22px; height: 22px; border-radius: 50%; background: #fff; color: var(--muted); font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center; }
/* маленький переключатель под строку 32px */
.sw { position: relative; width: 30px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: #cfd5db; cursor: pointer; justify-self: end; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.sw.is-on { background: var(--accent); }
.sw.is-on::after { transform: translateX(12px); }
.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gp-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 90px 110px 30px; align-items: center; gap: 10px; min-height: 40px; }
.gp-row .who { min-width: 0; white-space: nowrap; overflow: hidden; }
.gp-row .meta { color: var(--muted); font-size: 13px; text-align: right; }
.gp-row .sum { text-align: right; font-weight: 600; }
.gp-row.is-off .who, .gp-row.is-off .sum { color: var(--muted); font-weight: 400; }
.gp-row.is-owner { cursor: default; color: var(--muted); border-top: 1px solid #dde1e5; }
.gp-row.is-owner .sum { color: var(--muted); font-weight: 400; }
.gp-row.is-owner.can-pass:not(.is-off) .who, .gp-row.is-owner.can-pass:not(.is-off) .sum { color: var(--text); }
.how { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.how button { border: 0; background: none; padding: 2px 0; font: 13.5px var(--font); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.how button:hover { color: var(--text); }
.how button.is-on { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
.line.is-check { grid-template-columns: 22px minmax(0, 1fr) 90px 110px; cursor: pointer; user-select: none; }
.cbox { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid #c3c9cf; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
.line.is-check:not(.is-off) .cbox { background: var(--accent); border-color: var(--accent); }
.line.is-off .sum { color: var(--muted); font-weight: 400; }
.line.is-owner { cursor: default; color: var(--muted); background: var(--bg); }
.line.is-owner .sum { color: var(--muted); }
.sec > h3 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.fs { border: 1px solid var(--border); border-radius: 12px; }
.fs-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; background: var(--bg);
  border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; }
.fs-head h3 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.fs-body { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.sum-line { font-size: 15px; font-weight: 600; }
.sum-line b { color: var(--accent); }
.hint { margin: 0; font-size: 12px; color: var(--muted); }

/* поля */
.fl label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.fl input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font: 14px var(--font); color: var(--text); background: #fff; outline: none; }
.fl input:focus, .num-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.num-line { display: flex; align-items: center; gap: 12px; }
.num-wrap { position: relative; width: 160px; }
.num-wrap input { width: 100%; height: 38px; padding: 0 30px 0 12px; text-align: right; border: 1px solid var(--border);
  border-radius: var(--radius); font: 600 14px var(--font); outline: none; background: #fff; }
.num-wrap input:placeholder-shown { background: var(--warm); }
.num-unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.num-line .muted { color: var(--muted); font-size: 13px; }

.seg-track { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; gap: 2px; }
.seg-track button { flex: 1; height: 32px; border: 0; background: none; border-radius: 6px; font: 13px var(--font); color: var(--text); cursor: pointer; }
.seg-track button:hover { background: #fff; }
.seg-track button.is-on { background: var(--accent); color: #fff; font-weight: 600; }

/* строки «кто платит» / счётчики */
.lines { border: 1px solid var(--border); border-radius: var(--radius); }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 90px 110px 44px; align-items: center; gap: 12px;
  min-height: 46px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.line:last-child { border-bottom: 0; }
.line.is-meter { grid-template-columns: minmax(0, 1fr) 110px 90px; }
.line .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.line .who .fade { white-space: nowrap; overflow: hidden; }
.line .sub { font-size: 12px; color: var(--muted); }
.line .meta { color: var(--muted); font-size: 13px; text-align: right; }
.line .sum { text-align: right; font-weight: 600; }
.line .sum.off { color: var(--muted); font-weight: 400; }
.line.is-off .who { color: var(--muted); }
.line .tariff { font-size: 13px; text-align: right; }
.line .tariff.none { color: var(--muted); }
.line .go { font-size: 13px; text-align: right; color: var(--accent); text-decoration: none; }
.switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--border); cursor: pointer; border: 0; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch.is-on { background: var(--accent); }
.switch.is-on::after { transform: translateX(18px); }
.add-link { color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: none; }
/* «См. пример на странице объекта» — ссылка вместо блока; пример — в маленьком окне поверх */
.ex-link { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0;
  color: var(--accent); font: 13px var(--font); cursor: pointer; }
.ex-link:hover { text-decoration: underline; }
.ex-link svg { width: 15px; height: 15px; }
.ex-back { position: fixed; inset: 0; z-index: 20; background: rgba(30,40,50,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.ex-win { width: 480px; max-width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); overflow: hidden; }
.ex-head { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border); }
.ex-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--primary); }
.ex-head .x { margin-left: auto; }
.ex-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.ex-body .pv-card { width: 100%; }
.ex-note { margin: 0; font-size: 13px; color: var(--muted); }

.placeholder { border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px; color: var(--muted); font-size: 13px; background: var(--bg); }
.placeholder code { font: 600 13px var(--font); color: var(--text); }

/* превью — кусок «Ввода за месяц» */
.prev-cap { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
  display: grid; grid-template-columns: minmax(0, 1fr) 64px 90px 76px; gap: 0 8px; }
.prev-cap.is-flex { display: flex; align-items: center; }
.prev-cap span { text-transform: none; letter-spacing: 0; color: var(--text); text-align: right; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; }
.pr { display: grid; grid-template-columns: minmax(0, 1fr) 64px 90px 76px; align-items: center; gap: 0 8px; min-height: 40px; }
.pr .nm { font-weight: 600; }
.pr .nm small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.pr .v { text-align: right; color: var(--muted); }
.pr .in { height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--warm); }
.pr .in.wide { grid-column: 2 / 4; justify-self: end; width: 120px; }
.pr .tot { grid-column: 3 / 5; text-align: right; font-weight: 600; }
.pr .use { text-align: right; }
.pr .use span { display: inline-block; padding: 2px 8px; border-radius: 10px; background: var(--bg); font-size: 12px; color: var(--muted); }
.prev-group { margin: 0 -8px; padding: 8px; border-radius: var(--radius); }
.prev-group .gname { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; padding: 0 0 4px; }
.prev-group .pr { padding-left: 26px; }
.prev-group .pr .nm { font-size: 12px; font-weight: 400; }
.bill-line { display: flex; justify-content: space-between; gap: 16px; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; }
.bill-line .muted { color: var(--muted); }

@container (max-width: 560px) { .top-edit { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="win" role="dialog" aria-label="Услуги объекта">
  <div class="win-head">
    <h1>Услуги <span>· Королёва 61</span></h1>
    <button class="x" aria-label="Закрыть">×</button>
  </div>
  <div class="win-body">
    <nav class="nav" id="nav"></nav>
    <section class="pane" id="pane"></section>
  </div>
</div>

<script>
(function () {
  var ICON = {

  var unitOpen = false, unitNew = '';

    if (s.mode === 'receipt') return 'Каждый месяц вводите сумму из квитанции.';

  var CP_ICON = {

  // «Г с иконкой»: строка способов с иконкой + список с галочками + «Остаётся на вас» всегда (высота не прыгает)
  var AREA_ALL = TENANTS.reduce(function (a, t) { return a + t.area; }, 0);

  var SAMPLE = 5800;  // пример суммы квитанции — только чтобы показать деление
  function payCheck(s) {
    var sp = s.split;
    // вес арендатора и сумма за весь объект (null — сумма станет известна из квитанции)
    // По тарифу = как Фиксированная, только сумма за объект считается сама: тариф × объём
    var w = function (t) { return part(t, sp); };
    var total = s.mode === 'area' ? areaTotal(s) : (s.mode === 'fixed' && s.fixed) ? s.fixed : null;
    var on = TENANTS.filter(function (t) { return s.pays[t.id]; }), off = TENANTS.filter(function (t) { return !s.pays[t.id]; });
    var sum = function (list) { return list.reduce(function (a, t) { return a + w(t); }, 0); };
    var wAll = sum(TENANTS), wOn = sum(on), wOff = sum(off);
    // галочка «Остаётся на вас» появляется, только когда что-то остаётся; снята — остаток делят платящие
    var canPass = off.length > 0 && on.length > 0;

    var shareOf = function (t) { return !s.pays[t.id] ? 0 : ownerTakes ? w(t) / wAll : w(t) / wOn; };
    var ownShare = ownerTakes ? wOff / wAll : 0;
    // суммы ещё нет (по квитанции) — считаем от примера, суммы бледные

  // «На странице объекта»: кусок настоящей карточки «Ввода за месяц» (рамка, серая шапка КАПСОМ, строка услуги).

    // как начисляется

    var field = function (f, v) { return '<span class="num-wrap"><input data-f="' + f + '" value="' + (v ? num(v) : '') +

    if (s.mode === 'area') {
      var u = unitText(s), vol = volume(s);
      b = cp('ruler', '<span class="cp-label">Тариф</span>' +
        '<span class="num-wrap w-tariff"><input data-f="tariff" value="' + (s.tariff ? num(s.tariff) : '') + '" placeholder="0,00"><span class="num-unit">₽</span></span>' +
        '<span>за</span>' + unitPick(s) +
        '<span class="op">×</span><span class="num-wrap w-vol"><input data-f="volume" value="' + (vol ? num(vol) : '') + '" placeholder="0"' +
        ' title="Объём услуг" style="padding-right:' + (u ? 18 + u.length * 8 : 12) + 'px"><span class="num-unit">' + esc(u) + '</span></span>' +
        '<span class="cp-total">= ' + money((s.tariff || 0) * (vol || 0)) + '</span>');
    }
    if (s.mode === 'meters') b = cp('gauge', '<span>Показания вводите <b>каждый месяц</b>, тариф — у счётчика.</span>');
    if (s.mode === 'formula') b = '<div class="placeholder">Сейчас: <code>' + esc(s.formula || '—') + '</code> · окно формулы встанет сюда, упростим позже</div>';
    // По тарифу: всегда метка-предупреждение сразу после подписи
    var warn = s.mode === 'area' ? '<span class="badge-warn" title="Объём здесь постоянный. Если есть счётчик — выберите «По счётчикам»: расход возьмётся из показаний.">' +
      '<svg viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg>Не для счётчиков</span>' : '';
    h += block('Как начисляется · ' + MODES.filter(function (m) { return m[0] === s.mode; })[0][1] + warn, b);

    // делим и кто платит
    if (s.mode === 'receipt' || s.mode === 'fixed' || s.mode === 'area') {
      h += block('Делим и кто платит' + (s.mode === 'receipt' ? '<span class="badge-sample">для примера ' + money(SAMPLE).replace(',00', '') + '</span>' : ''),
        '<div class="gp">' + splitRow(s) + payCheck(s) + '</div>');
    } else if (s.mode === 'meters') {
      h += block('Счётчики услуги', meterLines(s, true));
    }

    // пример «На странице объекта» — не блоком, а ссылкой; по нажатию — маленькое окно поверх
    var pv = s.mode !== 'formula' ? preview(s) : '';
    if (pv) h += '<button type="button" class="ex-link" data-example><svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>См. пример на странице объекта</button>';
    h += '</div>';
    if (pv && exampleOpen) h += '<div class="ex-back" data-ex-close><div class="ex-win" role="dialog" aria-modal="true" aria-label="На странице объекта">' +
      '<div class="ex-head"><h2>На странице объекта</h2>' + (s.mode === 'receipt' ? '<span class="badge-sample">для примера ' + money(SAMPLE).replace(',00', '') + '</span>' : '') +
      '<button type="button" class="x" data-ex-close aria-label="Закрыть">×</button></div>' +
      '<div class="ex-body"><p class="ex-note">' + (s.mode === 'receipt' ? 'Каждый месяц вы вводите сюда сумму из квитанции.' :
        s.mode === 'meters' ? 'Каждый месяц вы вводите сюда показания счётчиков.' : 'Сумма считается сама — вводить ничего не нужно.') + '</p>' + pv + '</div></div></div>';
    else exampleOpen = false;
    document.getElementById('pane').innerHTML = h;
  }

  var exampleOpen = false;
  function render() { renderNav(); renderPane(); }
  function saved() {
    var el = document.getElementById('saved'); if (!el) return;
    el.textContent = 'Сохранено ✓'; el.classList.add('is-on');
    clearTimeout(saved.t); saved.t = setTimeout(function () { el.textContent = 'Сохранено'; el.classList.remove('is-on'); }, 1200);
  }

  document.addEventListener('click', function (e) {
    var t;
    if ((t = e.target.closest('[data-svc]'))) { current = SERVICES.filter(function (s) { return s.id === +t.dataset.svc; })[0];
      editing = false; render(); document.getElementById('pane').scrollTop = 0; return; }
    if ((t = e.target.closest('[data-mode]'))) {
      // верхнее меню: всегда новая услуга этого начисления (безымянную новую не плодим — меняем ей начисление)
      if (!(current.isNew && !current.name)) {
        current = { id: Date.now(), isNew: true, kind: 'custom', name: '', prov: '', split: 'shares', pays: { e: true, z: true }, meters: [] };
        SERVICES.push(current);
      }
      current.mode = t.dataset.mode; editing = true;
      render(); document.getElementById('pane').scrollTop = 0; document.querySelector('[data-f="name"]').focus(); return; }
    if (e.target.closest('[data-example]')) { exampleOpen = true; return renderPane(); }
    if ((t = e.target.closest('[data-ex-close]')) && (t.classList.contains('x') || e.target === t)) { exampleOpen = false; return renderPane(); }
    if (e.target.closest('.ex-win')) return;
    if (e.target.closest('[data-edit]')) { editing = !editing; renderPane(); return; }
    if (e.target.closest('[data-unit-open]')) { unitOpen = !unitOpen; return renderPane(); }
    if ((t = e.target.closest('[data-unit-del]'))) { var d = t.dataset.unitDel;
      OWN_UNITS = OWN_UNITS.filter(function (u) { return u !== d; });
      if (current.unit === d) { current.unit = 'м²'; current.volume = null; }
      return renderPane(); }
    if (e.target.closest('[data-unit-add]')) return addUnit();
    if ((t = e.target.closest('[data-unit]'))) { var k = t.dataset.unit; unitOpen = false;
      if (k !== unitText(current)) { current.unit = k; current.volume = null; }
      renderPane(); saved();
      var nx = document.querySelector('[data-f="volume"]'); if (nx) nx.focus(); return; }
    if ((t = e.target.closest('[data-goto-mode]'))) { e.preventDefault(); current.mode = t.dataset.gotoMode; render(); return saved(); }
    if (unitOpen && !e.target.closest('.sel-menu')) { unitOpen = false; renderPane(); }
    if ((t = e.target.closest('[data-split]'))) { current.split = t.dataset.split;
      renderPane(); return saved(); }
    if (e.target.closest('[data-owner]')) { current.ownerTakes = current.ownerTakes === false; renderPane(); return saved(); }
    if ((t = e.target.closest('[data-pay]'))) { current.pays[t.dataset.pay] = !current.pays[t.dataset.pay]; renderPane(); return saved(); }
    if (e.target.closest('a[href="#"]')) e.preventDefault();
  });
  // Пересчёт прямо при вводе: перерисовали — вернули фокус, набранный текст и курсор.
  // На blur ничего не перерисовываем — иначе клик в соседнее поле теряется.
  var NUMS = { tariff: 1, fixed: 1, volume: 1 };
  function store(f, v) {
    if (f === 'unitNew') { unitNew = v; return; }
    var raw = v.replace(/\s/g, '').replace(',', '.');
    current[f] = f === 'volume' ? (raw === '' ? null : parseFloat(raw) || 0) : NUMS[f] ? parseFloat(raw) || 0 : v;
  }
  document.addEventListener('input', function (e) {
    var f = e.target.dataset.f; if (!f) return;
    var v = e.target.value, pos = e.target.selectionStart;
    store(f, v); render();
    var el = document.querySelector('[data-f="' + f + '"]');
    if (el) { el.value = v; el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} }
  });
  document.addEventListener('change', function (e) {
    var f = e.target.dataset.f; if (!f) return;
    if (NUMS[f] && current[f] != null && e.target.value !== '') e.target.value = num(current[f]);  // 1470.7 → 1 470,7
    saved();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && exampleOpen) { exampleOpen = false; return renderPane(); }
    if (e.target.dataset.f === 'unitNew') {
      if (e.key === 'Enter') { e.preventDefault(); addUnit(); }
      if (e.key === 'Escape') { unitOpen = false; unitNew = ''; renderPane(); }
      return;
    }
    if (e.key === 'Enter' && e.target.dataset.f) e.target.blur();
  });
  render();
})();
</script>
</body>
</html>
